name: Update football matches

on:
  schedule:
    # Run hourly at minute 23 (UTC). Scheduled jobs can be delayed by GitHub.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize authorized feed
        env:
          MATCHES_FEED_URL: ${{ secrets.MATCHES_FEED_URL }}
        run: python scripts/update_matches.py

      - name: Commit changes when JSON changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Update football matches"
            git push
          else
            echo "matches.json unchanged; nothing to commit."
          fi
