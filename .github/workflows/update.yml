name: Auto update sport playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import playwright; print('Playwright Python package installed')"

      - name: Install Chromium browser and OS dependencies
        run: python -m playwright install --with-deps chromium

      - name: Search match pages and inspect public DOM
        run: python bot.py

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sport.m3u matches.csv matches.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Auto-update sport playlist and match status"
            git push
          fi
