name: Auto Update Sport M3U Playlist

on:
  schedule:
    # Chạy tự động mỗi 3 giờ (theo giờ UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Nút bấm chạy thủ công trên giao diện GitHub

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Grabber
        run: python bot.py

      - name: Commit and Push sport.m3u
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Kiểm tra xem file sport.m3u có tồn tại hay không trước khi add
          if [ -f "sport.m3u" ]; then
            git add sport.m3u
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sport.m3u playlist" && git push)
          else
            echo "File sport.m3u không tồn tại, bỏ qua bước commit."
          fi
