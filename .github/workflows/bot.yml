name: Auto Update Sport M3U Playlist

on:
  schedule:
    # Chạy khoảng mỗi 30 phút theo UTC; GitHub có thể trì hoãn lịch chạy.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run bot
        run: python bot.py

      - name: Commit and push playlist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sport.m3u
          if git diff --cached --quiet; then
            echo "sport.m3u không thay đổi; bỏ qua commit."
          else
            git commit -m "Auto-update sport.m3u playlist"
            git push
          fi
